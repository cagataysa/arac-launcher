plugins {
    id 'com.android.application'
}

def ksYolu = System.getenv("ARAC_KEYSTORE")
def ksSifre = System.getenv("ARAC_KS_PASS")
def sabitImza = ksYolu != null && ksSifre != null && new File(ksYolu).length() > 0

android {
    namespace 'com.cagatay.aracekran'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cagatay.aracekran'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        if (sabitImza) {
            sabit {
                storeFile file(ksYolu)
                storePassword ksSifre
                keyAlias 'arac'
                keyPassword ksSifre
            }
        }
    }

    buildTypes {
        debug {
            if (sabitImza) signingConfig signingConfigs.sabit
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
