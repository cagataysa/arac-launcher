name: APK derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Derle
        run: gradle assembleDebug --no-daemon

      - name: APK adını düzelt
        run: cp app/build/outputs/apk/debug/app-debug.apk AracEkrani.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AracEkrani
          path: AracEkrani.apk

      - name: Son sürümü yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: son-surum
          name: Araç Ekranı (son sürüm)
          make_latest: true
          files: AracEkrani.apk
